services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dataharbor
      MYSQL_DATABASE: demo
    ports:
      - "127.0.0.1:${DATAHARBOR_TEST_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdataharbor"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:${DATAHARBOR_TEST_MONGO_PORT:-27027}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${DATAHARBOR_TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dataharbor
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:${DATAHARBOR_TEST_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 5s
      timeout: 5s
      retries: 30
