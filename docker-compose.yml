# Optional local servers for trying the MySQL and PostgreSQL drivers.
# SQLite does not need this file. From the repo root:
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dataharbor
      MYSQL_DATABASE: demo
    ports:
      - "127.0.0.1:3306:3306"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dataharbor
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:5432:5432"
