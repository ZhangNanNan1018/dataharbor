name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatin/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust regression tests
        working-directory: src-tauri
        run: cargo test --lib --locked

  database-integration:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dataharbor
          MYSQL_DATABASE: demo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdataharbor"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dataharbor
          POSTGRES_DB: demo
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d demo"
          --health-interval=5s --health-timeout=5s --health-retries=30
      mongo:
        image: mongo:7
        ports: ['27027:27017']
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['16379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATAHARBOR_TEST_MYSQL_PORT: 3306
      DATAHARBOR_TEST_POSTGRES_PORT: 5432
      DATAHARBOR_TEST_MONGO_PORT: 27027
      DATAHARBOR_TEST_REDIS_PORT: 16379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatin/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config
      - run: npm ci
      - run: npm run build
      - name: Real database read/write, rollback and CSV round trips
        working-directory: src-tauri
        env:
          DATAHARBOR_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: cargo test --lib --locked -- --ignored --test-threads=1
