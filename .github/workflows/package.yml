name: Build preview installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatin/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config
      - run: npm ci
      - name: Fetch locked Rust sources for license notices
        working-directory: src-tauri
        run: cargo fetch --locked
      - run: npm run licenses
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: DataHarbor-preview-${{ runner.os }}-${{ runner.arch }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
